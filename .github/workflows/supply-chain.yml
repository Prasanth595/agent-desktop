name: Supply Chain

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release metadata consistency
        run: scripts/check-release-consistency.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check npm package and publish policy
        run: node scripts/check-npm-package.js

      - name: Cargo dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
          command-arguments: advisories licenses bans sources

      - name: Workflow security audit
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.25.2
          persona: regular
          min-severity: medium
          min-confidence: high
          advanced-security: false
          inputs: .github/workflows
